<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Game Shop</title>
<style>
body {
  margin:0; 
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #6b00d6, #0077ff);
  color:white;
  text-align:center;
}
.container {
  width: 90%;
  max-width: 400px;
  margin: 60px auto;
  background: rgba(255,255,255,0.15);
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}
input {
  background: rgba(255,255,255,0.3);
  color: white;
}
button {
  background:white;
  color: #6b00d6;
  font-weight: bold;
  cursor:pointer;
}
.anime {
  width:120px;
  animation: float 1.8s infinite alternate ease-in-out;
}
@keyframes float {
  from { transform: translateY(0px); }
  to   { transform: translateY(-15px); }
}
.shop-item {
  background: rgba(0,0,0,0.3);
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
}
.key-box {
  margin-top:10px;
  background: rgba(255,255,255,0.2);
  padding:10px;
  border-radius:10px;
  word-break:break-all;
}
</style>
</head>
<body>

<div id="login" class="container">
  <h2>เข้าสู่ระบบ</h2>
  <img class="anime" src="https://i.imgur.com/0y8Ftya.png">
  <input id="loginEmail" placeholder="อีเมล">
  <input id="loginPass" type="password" placeholder="รหัสผ่าน">
  <button onclick="login()">เข้าสู่ระบบ</button>
  <p style="cursor:pointer;text-decoration:underline" onclick="showSignup()">สมัครสมาชิก</p>
</div>

<div id="signup" class="container" style="display:none;">
  <h2>สมัครสมาชิก</h2>
  <img class="anime" src="https://i.imgur.com/0y8Ftya.png">
  <input id="regEmail" placeholder="อีเมล">
  <input id="regPass" type="password" placeholder="รหัสผ่าน">
  <input id="regPass2" type="password" placeholder="ยืนยันรหัสผ่าน">
  <button onclick="signup()">สมัครสมาชิก</button>
  <p style="cursor:pointer;text-decoration:underline" onclick="showLogin()">กลับไปเข้าสู่ระบบ</p>
</div>

<div id="shop" class="container" style="display:none;">
  <h2>ร้านค้าเกม</h2>
  <p id="userEmail"></p>
  <p>เหรียญ: <span id="coins">200</span></p>

  <div class="shop-item">
    <span>Premium Sword</span><span>50</span>
    <button onclick="buy('Premium Sword',50)">ซื้อ</button>
  </div>

  <div class="shop-item">
    <span>VIP Badge</span><span>70</span>
    <button onclick="buy('VIP Badge',70)">ซื้อ</button>
  </div>

  <div class="shop-item">
    <span>Mystic Skin</span><span>100</span>
    <button onclick="buy('Mystic Skin',100)">ซื้อ</button>
  </div>

  <h3>คีย์ของคุณ</h3>
  <div id="keys"></div>

  <button style="margin-top:20px;background:#ff4a4a;color:white;" onclick="logout()">ออกจากระบบ</button>
</div>

<script>
let coins = 200;
let keys = [];
let users = {}; // จำลองฐานข้อมูล

function showSignup(){
  login.style.display="none";
  signup.style.display="block";
}
function showLogin(){
  signup.style.display="none";
  login.style.display="block";
}
function showShop(){
  login.style.display="none";
  signup.style.display="none";
  shop.style.display="block";
}

// SIGNUP
function signup(){
  let email = regEmail.value;
  let pass = regPass.value;
  let pass2 = regPass2.value;

  if(pass !== pass2) return alert("รหัสไม่ตรงกัน");
  if(users[email]) return alert("อีเมลนี้มีอยู่แล้ว");

  users[email] = pass;
  alert("สมัครสมาชิกสำเร็จ!");
  showLogin();
}

// LOGIN
function login(){
  let email = loginEmail.value;
  let pass = loginPass.value;

  if(users[email] === pass){
    userEmail.textContent = email;
    showShop();
  } else {
    alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
  }
}

// BUY ITEM
function buy(name, price){
  if(coins < price) return alert("เหรียญไม่พอ!");

  coins -= price;
  document.getElementById("coins").textContent = coins;

  let key = name + "-KEY-" + Math.random().toString(36).substring(6);
  keys.push(key);

  let box = document.createElement("div");
  box.className = "key-box";
  box.textContent = key;
  document.getElementById("keys").appendChild(box);

  alert("ซื้อสำเร็จ! ได้รับคีย์แล้ว");
}

// LOGOUT
function logout(){
  shop.style.display="none";
  login.style.display="block";
}
</script>

</body>
</html>
