<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Shop</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #111;
            color: white;
            transition: 0.2s;
        }

        /* THEMES */
        body.dark { background:#111; color:white; }
        body.neon { background:#050014; color:#ff009d; }
        body.blue { background:#0a1e3f; color:#8ecbff; }

        .theme-btn {
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            margin-right: 5px;
            border-radius: 8px;
            font-weight: bold;
            background: #333;
            color: white;
        }

        .login-box, .shop-box {
            width: 350px;
            margin: 60px auto;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        input {
            width: 90%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 12px;
            outline: none;
        }

        button {
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            background: #e94560;
            color: white;
            cursor: pointer;
        }

        .product {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid #0f3460;
            box-shadow: 0 0 10px #e94560;
        }

    </style>
</head>
<body class="dark">

<center style="margin-top:15px;">
    <button class="theme-btn" onclick="changeTheme('dark')">Dark</button>
    <button class="theme-btn" onclick="changeTheme('neon')">Neon</button>
    <button class="theme-btn" onclick="changeTheme('blue')">Blue</button>
</center>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
    <h2 style="text-align:center;">🔐 Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <p id="loginMsg" style="text-align:center;margin-top:10px;"></p>
</div>

<!-- SHOP -->
<div class="shop-box" id="shopBox" style="display:none;">
    <h2 style="text-align:center;">🎮 Game Shop</h2>

    <div class="product">
        <h3>ดาบแสง</h3>
        <p>ราคา: 150 บาท</p>
        <button onclick="buy()">ซื้อสินค้า</button>
    </div>

    <h3>ใส่คีย์สินค้า</h3>
    <input id="keyInput" placeholder="เช่น KEY-TEST">
    <button onclick="redeemKey()">ยืนยัน</button>
    <p id="result"></p>

    <button style="margin-top:15px;background:#444;" onclick="logout()">ออกจากระบบ</button>
</div>

<script>
    // ---------- Login System ----------
    function login() {
        let u = document.getElementById("user").value;
        let p = document.getElementById("pass").value;
        let msg = document.getElementById("loginMsg");

        if (u === "admin" && p === "1234") {
            msg.innerHTML = "เข้าสู่ระบบสำเร็จ!";
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("shopBox").style.display = "block";
        } else {
            msg.innerHTML = "❌ ชื่อผู้ใช้หรือรหัสผ่านผิด";
        }
    }

    function logout() {
        document.getElementById("shopBox").style.display = "none";
        document.getElementById("loginBox").style.display = "block";
    }

    // ---------- Buy Product ----------
    function buy() {
        alert("สั่งซื้อสำเร็จ! (ตัวอย่าง)");
    }

    // ---------- Key Redeem ----------
    function redeemKey() {
        let key = document.getElementById("keyInput").value;
        let result = document.getElementById("result");

        if (key === "KEY-TEST") {
            result.innerHTML = "✔ ปลดล็อกสำเร็จ!";
        } else {
            result.innerHTML = "❌ คีย์ไม่ถูกต้อง";
        }
    }

    // ---------- Theme Change ----------
    function changeTheme(theme) {
        document.body.className = theme;
    }
</script>

</body>
</html>
